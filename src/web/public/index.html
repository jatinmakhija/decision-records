<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decisions</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <a href="#" id="home" class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1c1917" />
          <path d="M9 16.5 13.2 21 23 11" fill="none" stroke="#f6f3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Decisions</span>
      </a>
      <form id="search-form">
        <input id="q" type="search" placeholder="Search decisions" />
        <select id="status-filter">
          <option value="">Any status</option>
          <option>proposed</option>
          <option>decided</option>
          <option>rejected</option>
          <option>superseded</option>
          <option>revoked</option>
        </select>
        <button type="submit">Search</button>
      </form>
    </header>
    <main id="main"></main>
    <script src="/app.js"></script>
  </body>
</html>
